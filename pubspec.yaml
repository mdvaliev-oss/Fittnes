name: fittnes
description: "Персональный тренер по силовым тренировкам — professional strength training companion."
publish_to: "none"
version: 0.3.1+4

environment:
  sdk: ">=3.5.0 <4.0.0"
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

  # Localization (Russian-first built-in widgets)
  flutter_localizations:
    sdk: flutter

  # State management & DI
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.2.0

  # Local-first persistence (Drift / SQLite)
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.4
  path: ^1.9.0

  # Lightweight key-value storage (settings & profile)
  shared_preferences: ^2.3.2

  # Local reminder notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # UI / Design system
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0
  flutter_svg: ^2.0.10+1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Codegen — run: dart run build_runner build --delete-conflicting-outputs
  build_runner: ^2.4.11
  drift_dev: ^2.20.0
  custom_lint: ^0.6.4
  riverpod_lint: ^2.3.10

  # Branding asset generators (run manually — see below)
  #   dart run flutter_launcher_icons
  #   dart run flutter_native_splash:create
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.1

flutter:
  uses-material-design: true
  assets:
    - assets/exercises/       # exercise seed data (+ media from full import)
    - assets/nutrition/       # food catalog seed data
    - assets/branding/        # app icon / splash source art

# App launcher icon — regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/branding/icon.png"
  adaptive_icon_background: "#0A0A0F"
  adaptive_icon_foreground: "assets/branding/icon_foreground.png"
  remove_alpha_ios: true

# Native splash — regenerate with: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#0A0A0F"
  image: "assets/branding/splash_logo.png"
  android_12:
    color: "#0A0A0F"
    image: "assets/branding/splash_logo.png"
