name: Build Android APK

# Builds an installable release APK you can download from the run's
# "Artifacts" and sideload on an Android phone. Trigger it manually from the
# Actions tab (Run workflow), or it runs automatically on push.
on:
  workflow_dispatch:
  push:
    branches:
      - claude/session-tdabmo
    paths-ignore:
      - '**/*.md'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.7'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      - name: System SQLite (for Drift tests)
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-dev

      - name: Run tests
        run: flutter test
        continue-on-error: true

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: fittnes-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
